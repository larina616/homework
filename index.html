<!doctype html>
<html lang="zxx">

<head>
	<meta charset="UTF-8" />
	<title>Form</title>
	<link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="bg">
    <div class="container">
		<form>

      <div class="custom-switch">
				<input class="custom-switch-input" type="checkbox" id="switch">
				<label class="custom-switch-label" for="switch">
					<span>Login</span>
					<span>Register</span>
				</label>
			</div>

      <h1>Login</h1>

      <div class="fields-container">
        <input type="email" placeholder="E-mail" required="yes">
        <input type="password" placeholder="Password" required="yes">
      </div>

      <div class="remember-forgot-container">
        <div class="custom-checkbox">
				  <input type="checkbox" name="remember" id="remember">
				  <label for="remember">Remember Me</label>
			  </div>
        <a href="#">Forgot password?</a>
      </div>

      <button>Login</button>

      <div class="more-text">
        <div class="register-container">
          <p>Don't have an account yet?</p>
          <a href="#">Register</a>
        </div>
        <p>Or login</p>
      </div>

      <div class="icons">
        <a href="#">
          <svg>
            <use href="img/sprites.svg#instagram"></use>
          </svg>
        </a>
        <a href="#">
          <svg>
            <use href="img/sprites.svg#facebook"></use>
          </svg>
        </a>
        <a href="#">
          <svg>
            <use href="img/sprites.svg#linkedin"></use>
          </svg>
        </a>
      </div>

  </div>



		</form>
	</div>
</body>

</html>
